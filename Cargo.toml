[package]
name = "camellia-remote-server"
version = "1.0.0"
authors = ["Camellia Computing", "RustDesk contributors"]
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
default-run = "camellia-remote-identity"

[lib]
name = "camellia_remote_server"

[[bin]]
name = "camellia-remote-identity"
path = "src/main.rs"

[[bin]]
name = "camellia-remote-relay"
path = "src/relay.rs"

[[bin]]
name = "camellia-remote-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
camellia_remote_protocol = { package = "camellia-remote-protocol", path = "libs/camellia_remote_protocol" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
clap = { version = "4.5", features = ["string"] }
rust-ini = "0.21"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
deadpool = "0.12"
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit", rev = "8d1851d967b1014eb263bae23053a0e513431a9f" }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
once_cell = "1.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
flexi_logger = { version = "0.27", features = ["async", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", rev = "916508c1d1b4a5f8adaf70cf91add62d22fcda52", features = ["json", "native-tls"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", rev = "916508c1d1b4a5f8adaf70cf91add62d22fcda52", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features=false }

[workspace]
members = ["libs/camellia_remote_protocol"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed
