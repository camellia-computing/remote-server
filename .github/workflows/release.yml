name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref reachable from main; blank uses main
        required: false
        type: string
        default: ""
      publish:
        description: Publish the image, tag, and GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: remote-server-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.source.outputs.image }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - id: metadata
        name: Validate release metadata
        run: |
          python3 scripts/test_release_metadata.py
          python3 scripts/release_metadata.py --github-output
      - id: source
        name: Validate immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          if [[ "$PUBLISH" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "release tag already exists: $RELEASE_TAG" >&2
              exit 1
            fi
            successful_runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$commit" -f event=push -f status=success -f per_page=1 --jq '.total_count')"
            test "$successful_runs" -ge 1
          fi
          repository_lower="${GITHUB_REPOSITORY,,}"
          {
            echo "commit=$commit"
            echo "image=ghcr.io/$repository_lower"
            echo "source_date_epoch=$(git show -s --format=%ct "$commit")"
          } >> "$GITHUB_OUTPUT"

  build-native:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
      - name: Build locked release bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
        run: |
          cargo build --locked --release --bins
          stage="camellia-remote-server-$VERSION-linux-x86_64"
          install -d "release/$stage/bin" "release/$stage/systemd"
          install -m 0755 target/release/camellia-remote-identity "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-relay "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-utils "release/$stage/bin/"
          install -m 0644 deploy/systemd/*.service "release/$stage/systemd/"
          install -m 0600 deploy/server.env.example "release/$stage/server.env.example"
          install -m 0644 LICENSE NOTICE SOURCE_PROVENANCE.json SECURITY.md "release/$stage/"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C release -czf "release/$stage.tar.gz" "$stage"
          (cd release && sha256sum "$stage.tar.gz" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-server-release-${{ needs.validate.outputs.commit }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  approval:
    if: inputs.publish
    needs: [validate, build-native]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo "Approved ${{ needs.validate.outputs.tag }} from ${{ needs.validate.outputs.commit }}"

  publish-image:
    if: inputs.publish
    needs: [validate, build-native, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.tag }}
            ${{ needs.validate.outputs.image }}:sha-${{ needs.validate.outputs.commit }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  publish-release:
    if: inputs.publish
    needs: [validate, build-native, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remote-server-release-${{ needs.validate.outputs.commit }}
          path: release
      - name: Record image identity
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > release/OCI-DIGEST.txt
          (cd release && sha256sum OCI-DIGEST.txt >> SHA256SUMS)
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          subject-path: release/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          files: release/*
