name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref reachable from the default branch; blank uses the default branch
        required: false
        type: string
        default: ""
      publish:
        description: Publish the image, tag, and immutable GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: remote-server-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      commit: ${{ steps.source.outputs.commit }}
      image: ${{ steps.source.outputs.image }}
      signing_identity: ${{ steps.source.outputs.signing_identity }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require the trusted publication workflow
        if: inputs.publish
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          expected="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$TRIGGER_REF" == "refs/heads/$DEFAULT_BRANCH" && "$WORKFLOW_REF" == "$expected" ]] || {
            echo "Formal publication must run the default-branch workflow: $expected" >&2
            exit 1
          }

      - name: Checkout trusted release policy
        if: inputs.publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Release policy token
        if: inputs.publish
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Validate hosted release policy
        if: inputs.publish
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
        run: bash .github/scripts/validate-github-release-policy.sh

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive

      - id: metadata
        name: Validate release metadata
        run: |
          python3 scripts/test_release_metadata.py
          python3 scripts/release_metadata.py --github-output

      - id: source
        name: Validate immutable source and CI evidence
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH" || {
            echo "Release source $commit is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          }

          ci_run_id=""
          if [[ "$PUBLISH" == true ]]; then
            ci_run_id="$(
              gh api -X GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f head_sha="$commit" \
                -f event=push \
                -f status=success \
                -f per_page=1 \
                --jq '.workflow_runs[0].id // empty'
            )"
            [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "No successful push CI run exists for $commit" >&2
              exit 1
            }
          fi

          repository_lower="${GITHUB_REPOSITORY,,}"
          signing_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$DEFAULT_BRANCH"
          {
            echo "ci_run_id=$ci_run_id"
            echo "commit=$commit"
            echo "image=ghcr.io/$repository_lower"
            echo "signing_identity=$signing_identity"
            echo "source_date_epoch=$(git show -s --format=%ct "$commit")"
          } >> "$GITHUB_OUTPUT"

  build-native:
    name: Build native candidate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
      - name: Build locked deterministic bundle
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo build --locked --release --bins
          stage="camellia-remote-server-$VERSION-linux-x86_64"
          install -d "release/$stage/bin" "release/$stage/systemd"
          install -m 0755 target/release/camellia-remote-identity "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-relay "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-utils "release/$stage/bin/"
          install -m 0644 deploy/systemd/*.service "release/$stage/systemd/"
          install -m 0600 deploy/server.env.example "release/$stage/server.env.example"
          install -m 0644 LICENSE NOTICE SOURCE_PROVENANCE.json SECURITY.md "release/$stage/"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C release -czf "release/$stage.tar.gz" "$stage"
          (cd release && sha256sum "$stage.tar.gz" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-server-release-${{ needs.validate.outputs.commit }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  approval:
    name: Authorize production publication
    if: inputs.publish
    needs: [validate, build-native]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    steps:
      - name: Record approval target
        run: echo "Approved ${{ needs.validate.outputs.tag }} from ${{ needs.validate.outputs.commit }}"

  publish-image:
    name: Publish verified image
    if: inputs.publish
    needs: [validate, build-native, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: existing
        name: Discover recoverable immutable aliases
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          RELEASE_SIGNING_IDENTITY: ${{ needs.validate.outputs.signing_identity }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/reconcile-verified-image.sh discover

      - id: build
        name: Build and push by digest
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ needs.validate.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - id: digest
        name: Resolve exact image digest
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Unable to resolve the release image digest' >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Validate image platforms, runtime, and labels
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -e '
              [.manifests[]? |
                select(.platform.os == "linux") |
                .platform.architecture
              ] | sort | unique == ["amd64", "arm64"]
            ' >/dev/null
          docker pull "$IMAGE@$DIGEST"
          test "$(docker run --rm --entrypoint camellia-remote-identity "$IMAGE@$DIGEST" --version)" = "camellia-remote-identity $VERSION"
          test "$(docker run --rm --entrypoint camellia-remote-relay "$IMAGE@$DIGEST" --version)" = "camellia-remote-relay $VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE@$DIGEST")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")" = "$RELEASE_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE@$DIGEST")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Scan exact release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.validate.outputs.image }}@${{ steps.digest.outputs.digest }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m0s

      - name: Sign new image digest
        if: steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Create or verify immutable aliases
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          RELEASE_SIGNING_IDENTITY: ${{ needs.validate.outputs.signing_identity }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          bash .github/scripts/reconcile-verified-image.sh promote
          '${{ steps.digest.outputs.digest }}'

  publish-release:
    name: Publish immutable GitHub Release
    if: inputs.publish
    needs: [validate, build-native, approval, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remote-server-release-${{ needs.validate.outputs.commit }}
          path: release

      - name: Create deterministic release evidence
        shell: bash
        env:
          CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SIGNING_IDENTITY: ${{ needs.validate.outputs.signing_identity }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > release/OCI-DIGEST.txt
          jq -n \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg digest "$DIGEST" \
            --arg image "$IMAGE" \
            --arg signing_identity "$SIGNING_IDENTITY" \
            --arg source_commit "$RELEASE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" '{
              schema_version: 1,
              product: "Camellia Remote Server",
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              verified_ci_run_id: ($ci_run_id | tonumber),
              native_bundle: {
                platform: "linux-x86_64",
                signing: "github-oidc-attestation",
                distribution_trust: "provenance-only"
              },
              oci_image: {
                reference: $image,
                digest: $digest,
                aliases: [$tag, ("sha-" + $source_commit)],
                platforms: ["linux/amd64", "linux/arm64"],
                signing: {
                  mechanism: "keyless-cosign",
                  identity: $signing_identity,
                  issuer: "https://token.actions.githubusercontent.com"
                }
              }
            }' > release/release-metadata.json
          {
            echo '# Camellia Remote Server release'
            echo
            echo "Source commit: \`$RELEASE_COMMIT\`"
            echo
            echo "Verified push CI run: \`$CI_RUN_ID\`"
            echo
            echo "OCI image: \`$IMAGE@$DIGEST\`"
            echo
            echo 'The multi-architecture OCI digest is signed with keyless Cosign and is the deployment identity.'
            echo 'The native Linux bundle has no platform certificate; SHA-256 and GitHub OIDC attestation provide its publication evidence.'
          } > release/RELEASE-NOTES.md
          (
            cd release
            mapfile -t checksum_assets < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort
            )
            sha256sum "${checksum_assets[@]}" > SHA256SUMS
          )

      - name: Attest exact release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          subject-path: release/*

      - name: Release publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Create, read back, and publish immutable Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_ASSET_DIRECTORY: ${{ github.workspace }}/release
          RELEASE_CHECKSUM_FILE: ${{ github.workspace }}/release/SHA256SUMS
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_NOTES_FILE: ${{ github.workspace }}/release/RELEASE-NOTES.md
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: Camellia Remote Server ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/publish-verified-release.sh
