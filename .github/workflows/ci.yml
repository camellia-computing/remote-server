name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the exact CI components consistently.
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
      - name: Validate release metadata
        run: |
          python3 scripts/test_release_metadata.py
          python3 scripts/test_source_provenance.py
          python3 scripts/release_metadata.py
          python3 scripts/validate_source_provenance.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features

  deployment:
    name: Deployment and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github
          online-audits: false
          persona: pedantic
          version: 1.28.0
          advanced-security: false
          annotations: true
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate release state machines
        run: |
          python3 .github/scripts/test_manage_release.py
          python3 .github/scripts/test_container_release_evidence.py
          bash .github/scripts/tests/test_resolve_container_registries.sh
          bash .github/scripts/tests/test_verify_release_image.sh
          bash -n .github/scripts/publish-container-release.sh
          shellcheck .github/scripts/*.sh .github/scripts/tests/*.sh
      - name: Validate systemd units
        run: systemd-analyze security --offline=yes deploy/systemd/*.service >/dev/null
      - name: Validate Compose model
        env:
          CAMELLIA_REMOTE_API_SERVER: https://api.example.com
          CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN_FILE: /tmp/device-verification-token
          CAMELLIA_REMOTE_RELAY_ADDRESS: relay.example.com:21117
          CAMELLIA_REMOTE_SERVER_IMAGE: ghcr.io/example/remote-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - name: Resolve image version
        id: metadata
        run: python3 scripts/release_metadata.py --github-output
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: camellia-remote-server:test
          provenance: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: camellia-remote-server:test
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m0s
      - name: Exercise image binaries
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint camellia-remote-identity camellia-remote-server:test --version)" = "camellia-remote-identity $VERSION"
          test "$(docker run --rm --entrypoint camellia-remote-relay camellia-remote-server:test --version)" = "camellia-remote-relay $VERSION"

  required:
    name: CI / Required
    if: always()
    needs:
      - dependency-review
      - quality
      - deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          [[ "$QUALITY_RESULT" == success ]] || {
            echo "Quality must succeed, got: $QUALITY_RESULT" >&2
            exit 1
          }
          [[ "$DEPLOYMENT_RESULT" == success ]] || {
            echo "Deployment and automation must succeed, got: $DEPLOYMENT_RESULT" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == success ]] || {
              echo "Dependency review must succeed, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == skipped ]] || {
              echo "Dependency review must be skipped outside pull requests, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          fi
