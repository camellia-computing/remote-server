name: Dynamic Boundaries

on:
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-server-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-08-15

jobs:
  server-boundaries:
    name: Bounded server mutation corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run fixed-size malformed-message corpus
        run: cargo test --locked malformed_rendezvous_corpus_is_panic_free_and_bounded

  server-sanitizers:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Server parser ASan
            sanitizer: address
            test_filter: dynamic_boundaries::malformed_rendezvous_corpus_is_panic_free_and_bounded
          - label: Server database concurrency TSan
            sanitizer: thread
            test_filter: database::tests::concurrent_insert_and_read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned sanitizer toolchain
        run: rustup toolchain install --no-self-update "$NIGHTLY_TOOLCHAIN" --component rust-src --component llvm-tools-preview --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: server-${{ matrix.sanitizer }}
      - name: Build sanitizer target
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=0
          RUST_BACKTRACE: full
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >- # zizmor: ignore[template-injection] Sanitizer and test filters come only from the fixed in-repository matrix.
          cargo +"${NIGHTLY_TOOLCHAIN}" test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu --lib
          --no-run
      - name: Run bounded sanitizer target
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=0
          RUST_BACKTRACE: full
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >- # zizmor: ignore[template-injection] Sanitizer and test filters come only from the fixed in-repository matrix.
          timeout --signal=TERM --kill-after=30s 10m
          cargo +"${NIGHTLY_TOOLCHAIN}" test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu --lib
          "${{ matrix.test_filter }}" -- --test-threads=1
